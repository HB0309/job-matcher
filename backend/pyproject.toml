[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-matcher-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.2",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "psycopg2-binary>=2.9",
    "beautifulsoup4>=4.12",
    "linkedin-api>=2.0",
    "apscheduler>=3.10",
    "huggingface-hub>=0.27",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "playwright>=1.44",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "google-api-python-client>=2.120",
    "google-genai>=0.3",
    "groq>=0.11",
    "langgraph>=0.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
